# Builds and publishes a release when a version tag is pushed:
#
#   git tag -a v2.0.1 -m "Isi catatan rilis"
#   git push origin v2.0.1
#
# The app's update check reads the newest release, so phones are offered it the
# next time the app opens. The version comes from the tag, so the tag and the
# APK can never disagree. Setup and secrets: "Merilis versi baru" in README.md.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - run: flutter pub get

      # A failing test stops here, before anything is published.
      - run: flutter test

      - name: Restore the signing key and Supabase config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          ENV_JSON: ${{ secrets.ENV_JSON }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          printf '%s' "$KEY_PROPERTIES" > android/key.properties
          printf '%s' "$ENV_JSON" > env.json

      # The run number only ever rises. The offset keeps it above the build
      # numbers of the releases made by hand before this workflow existed.
      - name: Build the APKs
        run: |
          flutter build apk --release --split-per-abi --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define-from-file=env.json \
            --build-name="${GITHUB_REF_NAME#v}" \
            --build-number="$((GITHUB_RUN_NUMBER + 100))"

      # Needed to read a stack trace from an obfuscated build.
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ github.ref_name }}
          path: build/symbols
          retention-days: 90

      # Under these names, which the app looks for. The tag's message becomes
      # the release notes shown in the update dialog.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Checkout fetched the tag by its commit, which drops the tag's
          # message; without the real tag the notes would be the commit's.
          git fetch --force --depth=1 origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-from-tag \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            build/app/outputs/flutter-apk/app-x86_64-release.apk
